# Project 6. GPU build; on a CPU-only box replace pytorch-cuda with cpuonly.
#   mamba env create -f envs/learning.yml && mamba activate learning
name: learning
channels: [conda-forge, pytorch, nvidia]
dependencies:
  - python=3.11
  - pip
  - pytorch
  - pytorch-cuda=12.4
  - jupyterlab
  - pip:
      - transformers
      - peft
      - datasets
      - accelerate
      - tiktoken
